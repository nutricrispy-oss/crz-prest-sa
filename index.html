<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CRz SANANT</title>
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#0f1f1d;--mu:#64807b;--pr:#0f766e;--pr2:#14b8a6;--ok:#16a34a;--okb:#dcfce7;--er:#dc2626;--erb:#fee2e2;--wa:#d97706;--wab:#fef3c7;--bd:#e2eceb;--sh:0 2px 10px rgba(15,60,55,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1514;--card:#13211f;--tx:#e7f2f0;--mu:#8fb0aa;--pr:#2dd4bf;--pr2:#0f766e;--okb:#12351f;--erb:#3b1616;--wab:#3a2c0c;--bd:#1f3330;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:20px;letter-spacing:.3px}header small{opacity:.85}
main{padding:0 14px;margin-top:-14px;max-width:640px;margin-inline:auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.nav input{flex:1;text-align:center;font-size:18px;font-weight:700}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.dia{text-align:center;color:var(--mu);margin-top:6px;text-transform:capitalize}
.kpi{display:flex;gap:10px}.kpi div{flex:1}.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px}
.big{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;font-size:17px;font-weight:700;box-shadow:0 6px 16px rgba(15,118,110,.35)}
body.dark-fix .big{color:#04201c}
@media(prefers-color-scheme:dark){.big{color:#04201c}}
.big:disabled{opacity:.45;box-shadow:none}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .n{flex:1;min-width:0}.row .n b{display:block}.row .n small{color:var(--mu)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.c-ok{background:var(--okb);color:var(--ok)}.c-no{background:var(--erb);color:var(--er)}.c-pe{background:var(--wab);color:var(--wa)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 11px;font-weight:600;font-size:13px}
.btn.rev{color:var(--er);border-color:var(--er)}.btn.cob{color:var(--ok);border-color:var(--ok)}
.sun{background:var(--wab);color:var(--wa);padding:10px 12px;border-radius:12px;margin-bottom:10px;font-weight:600}
details summary{font-weight:700;cursor:pointer;padding:2px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:7px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr2),var(--pr))}
.sp{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
h3{margin:4px 0 10px;font-size:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px 0;border-radius:12px}
.tabs button span{display:block;font-size:20px}.tabs button.on{color:var(--pr);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f1f1d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
.hid{display:none}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sheet textarea{margin-top:4px}.ok{color:var(--ok)}.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kg small{color:var(--mu);display:block}.kg b{font-size:17px}.x{border:0;background:none;color:var(--er);font-size:18px;padding:4px 8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet label{display:block;margin-bottom:10px;color:var(--mu);font-size:13px}.sheet label input,.sheet label select{margin-top:4px;color:var(--tx)}.sheet .chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}.sheet .chk input{width:auto;margin:0}.sm{padding:5px 9px;font-size:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt{margin-top:10px}
</style>
</head>
<body>
<header><h1>CRz SANANT</h1><small id="sub"></small></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<script>
const SEED={"c":[{"n":"Corredor 100","d":33733500,"q":42000,"a":true,"p":31843500,"g":["2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10"]},{"n":"Corredor 29","d":23569000,"q":28000,"a":true,"p":22309000,"g":["2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 106","d":21600000,"q":28000,"a":true,"p":20340000,"g":["2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 24","d":42030000,"q":42000,"a":true,"p":40140000,"g":["2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 47","d":55710000,"q":42000,"a":true,"p":53820000,"g":["2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 27","d":12285000,"q":14000,"a":true,"p":11655000,"g":["2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 22","d":22500000,"q":28000,"a":true,"p":21240000,"g":["2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 17","d":38780000,"q":56000,"a":true,"p":36260000,"g":["2026-10-02","2026-10-03","2026-10-04","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-11","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-18","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor --","d":10845000,"q":0,"a":false,"p":10845000,"g":[]},{"n":"Corredor 24,3","d":14400000,"q":14000,"a":true,"p":13770000,"g":["2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 81","d":34020000,"q":42000,"a":true,"p":32130000,"g":["2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 24,2","d":13992000,"q":28000,"a":true,"p":12732000,"g":["2026-10-21"]},{"n":"Corredor 39","d":20790000,"q":28000,"a":true,"p":19530000,"g":["2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]},{"n":"Corredor 05,2","d":6300000,"q":28000,"a":true,"p":5040000,"g":["2026-09-01","2026-09-02","2026-09-03","2026-09-04","2026-09-05","2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11","2026-09-12","2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18","2026-09-19","2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-19","2026-10-20","2026-10-21"]}],"np":[[0,"2026-10-21",42000]],"h":{"2026-10-01":322000,"2026-10-02":266000,"2026-10-03":266000,"2026-10-05":266000,"2026-10-06":266000,"2026-10-07":266000,"2026-10-08":224000,"2026-10-09":182000,"2026-10-10":182000,"2026-10-12":182000,"2026-10-13":126000,"2026-10-14":126000,"2026-10-15":70000,"2026-10-16":56000,"2026-10-17":56000,"2026-10-19":28000,"2026-10-20":28000},"r":[[7,1328000,"2026-10-01"],[3,408000,"2026-10-07"],[4,408000,"2026-10-08"],[2,1000000,"2026-10-10"],[6,692000,"2026-10-12"],[9,290000,"2026-10-14"],[10,954000,"2026-10-14"],[5,430000,"2026-10-15"],[1,916000,"2026-10-17"],[11,384000,"2026-10-20"]]};
const KEY='crz_sanant_v1';
const $=s=>document.querySelector(s);
const Gs=n=>'Gs. '+Math.round(n).toLocaleString('de-DE');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const dt=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const uid=()=>Math.random().toString(36).slice(2,9);
let S,view='hoy',fecha=iso(new Date());
const today=()=>iso(new Date());

function seed(){
  const corr=SEED.c.map((c,i)=>({id:'c'+i,nombre:c.n,deuda:c.d,cuota:c.q,activo:c.a,previo:c.p}));
  const pagos=[];
  SEED.c.forEach((c,i)=>c.g.forEach(g=>{const f=Array.isArray(g)?g[0]:g,m=Array.isArray(g)?g[1]:c.q;pagos.push({id:uid(),c:'c'+i,f,m})}));
  return {corr,pagos,nopago:SEED.np.map(x=>({c:'c'+x[0],f:x[1],m:x[2]})),hist:{...SEED.h},renov:SEED.r.map(x=>({id:uid(),c:'c'+x[0],m:x[1],f:x[2]})),retiros:[],gastos:[]};
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.corr){S=seed();save()}else{const d=seed();let ch=0;for(const k of['hist','renov','retiros','gastos'])if(!S[k]){S[k]=d[k];ch=1}if(ch)save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

const pagado=c=>c.previo+S.pagos.filter(p=>p.c===c.id&&p.f>=(c.desde||'')).reduce((a,p)=>a+p.m,0);
const saldo=c=>c.deuda-pagado(c);
const pagosDe=(c,f)=>S.pagos.filter(p=>p.c===c.id&&p.f===f);
const npDe=(c,f)=>S.nopago.find(p=>p.c===c.id&&p.f===f);
const totalDia=f=>S.pagos.filter(p=>p.f===f).reduce((a,p)=>a+p.m,0)+(S.hist[f]||0);
const activos=()=>S.corr.filter(c=>c.activo&&c.cuota>0&&saldo(c)>0);

function generar(f){
  if(dt(f).getDay()===0)return toast('Los domingos se carga solo manual');
  let n=0;
  activos().forEach(c=>{if(!pagosDe(c,f).length&&!npDe(c,f)){S.pagos.push({id:uid(),c:c.id,f,m:Math.min(c.cuota,saldo(c))});n++}});
  save();render();toast(n?`${n} cobros generados`:'Ya estaba todo generado');
}
function revertir(cid,f){
  const c=S.corr.find(x=>x.id===cid),ps=pagosDe(c,f);if(!ps.length)return;
  const m=ps.reduce((a,p)=>a+p.m,0);
  if(!confirm(`¿Revertir el cobro de ${c.nombre} (${Gs(m)}) del ${fmt(f)}?\nSe marcará como NO PAGÓ.`))return;
  S.pagos=S.pagos.filter(p=>!(p.c===cid&&p.f===f));S.nopago.push({c:cid,f,m});
  save();render();toast('Cobro revertido · marcado como no pagó');
}
function cobrar(cid,f,m){
  const c=S.corr.find(x=>x.id===cid);m=m||Math.min(c.cuota,saldo(c));
  if(!(m>0))return toast('Monto inválido');
  S.nopago=S.nopago.filter(p=>!(p.c===cid&&p.f===f));
  S.pagos.push({id:uid(),c:cid,f,m,man:1});save();render();toast('Cobro registrado');
}

function mask(e){let v=e.target.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}
function setFecha(v){const m=v.match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return toast('Fecha: dd/mm/aaaa');const s=`${m[3]}-${m[2]}-${m[1]}`;if(isNaN(dt(s))||iso(dt(s))!==s)return toast('Fecha inválida');fecha=s;render()}

function vHoy(){
  const dom=dt(fecha).getDay()===0,esHoy=fecha===today();
  const lista=S.corr.filter(c=>dom?(pagosDe(c,fecha).length||npDe(c,fecha)):(c.activo||pagosDe(c,fecha).length));
  const cobr=lista.filter(c=>pagosDe(c,fecha).length).length;
  let h=`<div class="card"><div class="nav"><button onclick="fecha=addD(fecha,-1);render()">‹</button>
  <input id="fi" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" value="${fmt(fecha)}" oninput="mask(event)" onchange="setFecha(this.value)" onfocus="this.select()">
  <button onclick="fecha=addD(fecha,1);render()">›</button></div>
  <div class="dia">${DIAS[dt(fecha).getDay()]}${esHoy?' · hoy':''}</div></div>
  <div class="card"><div class="kpi"><div><small>Cobrado del día</small><b>${Gs(totalDia(fecha))}</b></div><div><small>Cobrados</small><b>${cobr}/${lista.length}</b></div></div>
  <div class="mt">${dom?`<div class="sun">☀️ Domingo: solo carga manual, si hubiera cobros.</div>`:`<button class="big" onclick="generar(fecha)">⚡ Generar cobros ${esHoy?'de hoy':'del día'}</button>`}</div><button class="btn mt" style="width:100%" onclick="resumenDia()">📲 Resumen del día por WhatsApp</button></div>
  <div class="card"><h3>Cobros del día</h3>`;
  if(!lista.length)h+=`<div class="sp">${dom?'Sin cobros cargados este domingo.':'Nada por mostrar.'}</div>`;
  lista.forEach(c=>{const ps=pagosDe(c,fecha),np=npDe(c,fecha),m=ps.reduce((a,p)=>a+p.m,0);
    h+=`<div class="row"><div class="n"><b>${c.nombre}</b><small>${ps.length?Gs(m):'Cuota '+Gs(c.cuota)}</small></div>
    ${ps.length?`<span class="chip c-ok">Cobrado</span><button class="btn rev" onclick="revertir('${c.id}','${fecha}')">Revertir</button>`
    :np?`<span class="chip c-no">No pagó</span><button class="btn cob" onclick="cobrar('${c.id}','${fecha}',${np.m})">Cobrar</button>`
    :`<span class="chip c-pe">Pendiente</span><button class="btn cob" onclick="cobrar('${c.id}','${fecha}')">Cobrar</button>`}</div>`});
  h+=`</div><div class="card"><details ${dom?'open':''}><summary>＋ Cobro manual</summary><div class="g2 mt">
  <select id="mc" onchange="$('#mm').value=S.corr.find(c=>c.id===this.value).cuota||''">${S.corr.filter(c=>saldo(c)>0).map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select>
  <input id="mm" inputmode="numeric" placeholder="Monto Gs." value="${(S.corr.find(c=>saldo(c)>0)||{}).cuota||''}"></div>
  <button class="big mt" onclick="const m=parseInt($('#mm').value.replace(/\\D/g,''));cobrar($('#mc').value,fecha,m)">Agregar cobro</button></details></div>`;
  return h;
}
function vCorr(){
  const tot=S.corr.reduce((a,c)=>a+saldo(c),0);
  let h=`<div class="card"><div class="kpi"><div><small>Deuda pendiente total</small><b>${Gs(tot)}</b></div><div><small>Activos</small><b>${activos().length}</b></div></div><button class="big mt" onclick="nuevoCorr()">＋ Nuevo corredor</button></div>`;
  S.corr.forEach(c=>{const s=saldo(c),pc=Math.min(100,pagado(c)/c.deuda*100),q=c.cuota?Math.ceil(s/c.cuota):0;
    h+=`<div class="card"><div class="row" style="border:0;padding:0"><div class="n"><b>${c.nombre}</b><small>Cuota ${c.cuota?Gs(c.cuota):'—'}</small></div>
    <span class="chip ${s<=0?'c-ok':'c-pe'}">${s<=0?'Saldado':q+' cuotas'}</span></div>
    <div class="bar"><i style="width:${pc}%"></i></div><div class="sp"><span>Pagado ${Gs(pagado(c))}</span><span>Saldo ${Gs(Math.max(s,0))}</span></div>
    <div class="g3 mt"><button class="btn sm" onclick="editCorr('${c.id}')">✏️ Editar</button><button class="btn sm cob" onclick="waCorr('${c.id}')">📲 WhatsApp</button><button class="btn sm" onclick="renovarCorr('${c.id}')">🔄 Renovar</button></div></div>`});
  return h;
}
function vHist(){
  let h=`<div class="card"><h3>Últimos 31 días</h3>`;
  for(let i=0;i<31;i++){const f=addD(today(),-i),t=totalDia(f),d=dt(f).getDay(),np=S.nopago.filter(p=>p.f===f).length;
    h+=`<div class="row" onclick="fecha='${f}';view='hoy';render()"><div class="n"><b>${fmt(f)}</b><small>${DIAS[d]}${np?' · '+np+' no pagó':''}</small></div><b>${t?Gs(t):'—'}</b></div>`}
  h+=`</div><div class="card"><h3>No pagó (${S.nopago.length})</h3>`;
  const l=[...S.nopago].sort((a,b)=>b.f.localeCompare(a.f)).slice(0,40);
  if(!l.length)h+=`<div class="sp">Sin registros.</div>`;
  l.forEach(p=>{const c=S.corr.find(x=>x.id===p.c);h+=`<div class="row"><div class="n"><b>${c.nombre}</b><small>${fmt(p.f)}</small></div><span>${Gs(p.m)}</span></div>`});
  return h+`</div>`;
}
function vAj(){
  const lb=lastB(),ask=ls.g(K_ASK)!=='0';
  return `<div class="card"><h3>☁️ Respaldo en Google Drive</h3>
  <div class="sp">Último respaldo: <b class="${lb===today()?'ok':''}">${lb?fmt(lb)+(lb===today()?' (hoy ✓)':''):'nunca'}</b></div>
  <label class="chk" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" style="width:auto" ${ask?'checked':''} onchange="toggleAsk(this.checked)"> Preguntar una vez al día al abrir la app</label>
  <div class="g2"><button class="big" style="padding:12px;font-size:15px" onclick="backupDrive()">Respaldar ahora</button><button class="btn" onclick="restoreDrive()">Restaurar de Drive</button></div>
  <details class="mt"><summary>Conectar mi Google Drive (una sola vez)</summary>
  <div class="sp mt">ID de cliente de Google:</div><input id="cid" class="mt" placeholder="xxxx.apps.googleusercontent.com" value="${gcid()}" onchange="saveCid(this.value)">
  <ol class="sp" style="padding-left:18px;line-height:1.6">
  <li>Entrá a console.cloud.google.com y creá un proyecto.</li><li>Menú «APIs y servicios» → «Biblioteca» → activá <b>Google Drive API</b>.</li>
  <li>«Pantalla de consentimiento OAuth» → tipo Externo → agregá tu Gmail como <b>usuario de prueba</b>.</li>
  <li>«Credenciales» → Crear → ID de cliente OAuth → Aplicación web.</li>
  <li>En «Orígenes autorizados de JavaScript» poné la dirección de tu app (ej. https://tuusuario.github.io).</li><li>Copiá el ID de cliente y pegalo arriba.</li></ol>
  <div class="sp">La primera vez Google puede avisar «app no verificada»: tocá Avanzado → Continuar. La app solo ve el archivo que ella misma crea.</div></details></div>
  <div class="card"><h3>Respaldo en archivo</h3><div class="g2"><button class="btn" onclick="exportar()">⬇ Exportar</button><button class="btn" onclick="$('#imp').click()">⬆ Importar</button></div>
  <input type="file" id="imp" accept=".json" class="hid" onchange="importar(this.files[0])"></div>
  <div class="card"><h3>Datos originales</h3><div class="sp">Restaura los datos de la planilla CRz_SANANT_2_0.xlsx. Se pierden los cambios hechos en la app.</div>
  <button class="btn rev mt" onclick="if(confirm('¿Restaurar los datos originales de la planilla?')){S=seed();save();render();toast('Datos restaurados')}">Restaurar planilla</button></div>`}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='crz-sanant-'+today()+'.json';a.click()}
function importar(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.corr||!d.pagos)throw 0;S=d;save();render();toast('Respaldo importado')}catch(e){toast('Archivo no válido')}};r.readAsText(f)}

function openForm(t,fs,ok){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h3>${t}</h3>${fs.map(f=>f.t==='chk'?`<label class="chk"><input type="checkbox" id="f_${f.k}" ${f.v?'checked':''}> ${f.l}</label>`:f.t==='sel'?`<label>${f.l}<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==f.v?'selected':''}>${o[1]}</option>`).join('')}</select></label>`:`<label>${f.l}<input id="f_${f.k}" value="${f.t==='d'&&f.v?fmt(f.v):(f.v??'')}" ${f.t==='d'?'inputmode="numeric" placeholder="dd/mm/aaaa" oninput="mask(event)"':f.t==='n'?'inputmode="numeric"':''}></label>`).join('')}
  <div class="g2 mt"><button class="btn" id="fx">Cancelar</button><button class="big" id="fo" style="padding:11px">Guardar</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#fx').onclick=()=>m.remove();
  m.querySelector('#fo').onclick=()=>{const r={};for(const f of fs){const e=m.querySelector('#f_'+f.k);let v=f.t==='chk'?e.checked:e.value.trim();
    if(f.t==='n')v=parseInt(v.replace(/\D/g,''))||0;
    if(f.t==='d'){const x=v.match(/^(\d\d)\/(\d\d)\/(\d{4})$/);const s=x&&`${x[3]}-${x[2]}-${x[1]}`;if(!s||iso(dt(s))!==s)return toast('Fecha inválida (dd/mm/aaaa)');v=s}
    r[f.k]=v}
    if(ok(r)!==false)m.remove()};
}
const cget=id=>S.corr.find(c=>c.id===id);
function nuevoCorr(){openForm('Nuevo corredor',[{k:'n',l:'Nombre',t:'s',v:'Corredor '},{k:'d',l:'Deuda total (Gs.)',t:'n'},{k:'q',l:'Cuota diaria (Gs.)',t:'n'},{k:'f',l:'Fecha de inicio',t:'d',v:today()}],r=>{
  if(!r.n||!r.d||!r.q){toast('Completá nombre, deuda y cuota');return false}
  S.corr.push({id:'c'+uid(),nombre:r.n,deuda:r.d,cuota:r.q,activo:true,previo:0,desde:r.f});save();render();toast('Corredor agregado')})}
function editCorr(id){const c=cget(id);openForm('Editar '+c.nombre,[{k:'n',l:'Nombre',t:'s',v:c.nombre},{k:'d',l:'Deuda total (Gs.)',t:'n',v:c.deuda},{k:'q',l:'Cuota diaria (Gs.)',t:'n',v:c.cuota},{k:'tel',l:'WhatsApp del cliente (opcional)',t:'s',v:c.tel||''},{k:'a',l:'Activo (entra en "Generar cobros")',t:'chk',v:c.activo}],r=>{
  if(!r.n||!r.d){toast('Nombre y deuda son obligatorios');return false}
  Object.assign(c,{nombre:r.n,deuda:r.d,cuota:r.q,activo:r.a,tel:r.tel});save();render();toast('Corredor actualizado')})}
function renovarCorr(id){const c=cget(id);openForm('Renovar '+c.nombre,[{k:'m',l:'Monto renovado (efectivo entregado, Gs.)',t:'n'},{k:'d',l:'Nueva deuda total (Gs.)',t:'n'},{k:'q',l:'Nueva cuota diaria (Gs.)',t:'n',v:c.cuota},{k:'f',l:'Fecha de renovación',t:'d',v:today()}],r=>{
  if(!r.d||!r.q){toast('Indicá nueva deuda y cuota');return false}
  if(r.m)S.renov.push({id:uid(),c:id,m:r.m,f:r.f});
  Object.assign(c,{deuda:r.d,cuota:r.q,previo:0,desde:r.f,activo:true});save();render();toast('Préstamo renovado')})}

let cyc=null;
const cStart=i=>iso(new Date(2026,5+2*i,1)),cEnd=i=>iso(new Date(2026,5+2*i+2,0));
const curCyc=()=>{const n=new Date();return Math.max(0,Math.floor(((n.getFullYear()-2026)*12+n.getMonth()-5)/2))};
const enR=(f,i)=>f>=cStart(i)&&f<=cEnd(i);
function cicloCalc(i){
  let arr=0,r;
  for(let k=0;k<=i;k++){
    let cob=0;for(let f=cStart(k);f<=cEnd(k);f=addD(f,1))if(f>='2026-10-01')cob+=totalDia(f);
    const ren=S.renov.filter(x=>enR(x.f,k)).reduce((a,x)=>a+x.m,0),ret=S.retiros.filter(x=>enR(x.f,k)).reduce((a,x)=>a+x.m,0),gas=S.gastos.filter(x=>enR(x.f,k)).reduce((a,x)=>a+x.m,0);
    r={cob,ren,caja:cob-ren,arr,disp:cob-ren+arr,ret,gas,sal:cob-ren+arr-ret-gas};arr=r.sal}
  return r;
}
function vCaja(){
  if(cyc===null)cyc=curCyc();
  const r=cicloCalc(cyc),deuda=S.corr.reduce((a,c)=>a+Math.max(saldo(c),0),0),inR=a=>a.filter(x=>enR(x.f,cyc)).sort((a,b)=>b.f.localeCompare(a.f));
  const lst=(a,tipo,fn)=>inR(a).map(x=>`<div class="row"><div class="n"><b>${fn(x)}</b><small>${fmt(x.f)}</small></div><b>${Gs(x.m)}</b><button class="x" onclick="delItem('${tipo}','${x.id}')">✕</button></div>`).join('')||'<div class="sp">Sin registros en este ciclo.</div>';
  return `<div class="card"><div class="nav"><button onclick="cyc=Math.max(0,cyc-1);render()">‹</button><div style="flex:1;text-align:center"><b>Ciclo ${cyc+1}</b><div class="dia" style="margin:0">${fmt(cStart(cyc))} – ${fmt(cEnd(cyc))}</div></div><button onclick="cyc++;render()">›</button></div></div>
  <div class="card"><div class="kg"><div><small>Total cobrado</small><b>${Gs(r.cob)}</b></div><div><small>Total renovado</small><b>${Gs(r.ren)}</b></div><div><small>En caja del ciclo</small><b>${Gs(r.caja)}</b></div><div><small>Arrastre anterior</small><b>${Gs(r.arr)}</b></div><div><small>Disponible</small><b>${Gs(r.disp)}</b></div><div><small>Retirado</small><b>${Gs(r.ret)}</b></div><div><small>Gastos</small><b>${Gs(r.gas)}</b></div><div><small>Saldo a arrastrar</small><b>${Gs(r.sal)}</b></div></div>
  <div class="kg mt"><div><small>Deuda pendiente</small><b>${Gs(deuda)}</b></div><div><small>Efectivo D+C</small><b>${Gs(deuda+r.sal)}</b></div></div></div>
  <div class="card"><div class="row" style="border:0;padding:0 0 6px"><h3 style="flex:1;margin:0">Renovados</h3><button class="btn sm cob" onclick="addRenov()">＋ Agregar</button></div>${lst(S.renov,'renov',x=>cget(x.c)?cget(x.c).nombre:'—')}</div>
  <div class="card"><div class="row" style="border:0;padding:0 0 6px"><h3 style="flex:1;margin:0">Retiros</h3><button class="btn sm cob" onclick="addRetiro()">＋ Agregar</button></div>${lst(S.retiros,'retiros',x=>x.nota||'Retiro')}</div>
  <div class="card"><div class="row" style="border:0;padding:0 0 6px"><h3 style="flex:1;margin:0">Gastos</h3><button class="btn sm cob" onclick="addGasto()">＋ Agregar</button></div>${lst(S.gastos,'gastos',x=>x.cat+(x.desc?' · '+x.desc:''))}</div>`;
}
function delItem(t,id){if(!confirm('¿Eliminar este registro?'))return;S[t]=S[t].filter(x=>x.id!==id);save();render()}
function addRenov(){openForm('Nuevo renovado',[{k:'c',l:'Corredor',t:'sel',o:S.corr.map(c=>[c.id,c.nombre])},{k:'m',l:'Monto (Gs.)',t:'n'},{k:'f',l:'Fecha',t:'d',v:today()}],r=>{if(!r.m){toast('Ingresá el monto');return false}S.renov.push({id:uid(),...r});save();render()})}
function addRetiro(){openForm('Nuevo retiro',[{k:'m',l:'Monto (Gs.)',t:'n'},{k:'f',l:'Fecha',t:'d',v:today()},{k:'nota',l:'Nota',t:'s'}],r=>{if(!r.m){toast('Ingresá el monto');return false}S.retiros.push({id:uid(),...r});save();render()})}
function addGasto(){openForm('Nuevo gasto',[{k:'cat',l:'Categoría',t:'sel',o:['Combustible','Cobrador','Descuentos','Otros'].map(x=>[x,x])},{k:'desc',l:'Descripción',t:'s'},{k:'m',l:'Monto (Gs.)',t:'n'},{k:'f',l:'Fecha',t:'d',v:today()}],r=>{if(!r.m){toast('Ingresá el monto');return false}S.gastos.push({id:uid(),...r});save();render()})}

/* ===== Respaldo en Google Drive ===== */
const K_CID='crz_gcid',K_LB='crz_lastbackup',K_SNZ='crz_snooze',K_ASK='crz_askb';
const ls={g:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const gcid=()=>ls.g(K_CID),lastB=()=>ls.g(K_LB);
let gTok=null,gExp=0;
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('sin conexión'));document.head.appendChild(s)})}
async function gToken(){
  if(gTok&&Date.now()<gExp)return gTok;
  await loadGIS();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:gcid(),scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r.error)return rej(new Error(r.error));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;res(gTok)},
      error_callback:e=>rej(new Error(e.type||'cancelado'))});
    tc.requestAccessToken();
  });
}
const FN='crz-sanant-respaldo.json';
async function driveFind(H){
  const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id,modifiedTime)&q='+encodeURIComponent(`name='${FN}' and trashed=false`),{headers:H});
  if(!r.ok)throw new Error('Drive '+r.status);
  return ((await r.json()).files||[])[0];
}
async function backupDrive(){
  if(!gcid()){toast('Primero pegá el ID de cliente de Google en Ajustes');view='aj';render();return false}
  try{
    toast('Conectando con Google Drive…');
    const H={Authorization:'Bearer '+await gToken()},f=await driveFind(H),b='crzb'+uid();
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(f?{}:{name:FN})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`;
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(f?'/'+f.id:'')+'?uploadType=multipart',{method:f?'PATCH':'POST',headers:{...H,'Content-Type':'multipart/related; boundary='+b},body});
    if(!r.ok)throw new Error('Drive '+r.status);
    ls.s(K_LB,today());toast('✅ Copia guardada en Google Drive');if(view==='aj')render();return true;
  }catch(e){toast('No se pudo respaldar: '+e.message);return false}
}
async function restoreDrive(){
  if(!gcid())return toast('Primero pegá el ID de cliente de Google');
  try{
    const H={Authorization:'Bearer '+await gToken()},f=await driveFind(H);
    if(!f)return toast('No hay copia en Drive todavía');
    if(!confirm('Se reemplazarán los datos de este teléfono por la copia de Drive del '+fmt(iso(new Date(f.modifiedTime)))+'. ¿Continuar?'))return;
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:H});
    if(!r.ok)throw new Error('Drive '+r.status);
    const d=await r.json();if(!d.corr||!d.pagos)throw new Error('archivo no válido');
    S=d;save();render();toast('Copia restaurada desde Drive');
  }catch(e){toast('No se pudo restaurar: '+e.message)}
}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet">'+html+'</div>';document.body.appendChild(m);return m}
function askBackup(){
  if(ls.g(K_ASK)==='0'||lastB()===today()||ls.g(K_SNZ)===today())return;
  const ult=lastB()?fmt(lastB()):'nunca';
  const m=modal(`<h3>💾 Copia de seguridad</h3><div class="sp" style="margin-bottom:12px">Hoy todavía no respaldaste tus datos. Última copia: <b>${ult}</b>.<br>${gcid()?'Se guardará en tu Google Drive.':'Aún no conectaste Google Drive: se descargará un archivo.'}</div>
  <button class="big" id="bk1">Respaldar ahora</button><div class="g2 mt"><button class="btn" id="bk2">Más tarde</button><button class="btn" id="bk3">Hoy no</button></div>`);
  m.querySelector('#bk1').onclick=async()=>{m.remove();if(gcid())await backupDrive();else{exportar();ls.s(K_LB,today())}};
  m.querySelector('#bk2').onclick=()=>m.remove();
  m.querySelector('#bk3').onclick=()=>{ls.s(K_SNZ,today());m.remove()};
}
function saveCid(v){ls.s(K_CID,v.trim());gTok=null;toast(v.trim()?'ID guardado':'ID borrado')}
function toggleAsk(on){ls.s(K_ASK,on?'1':'0')}

/* ===== WhatsApp ===== */
const CAP=c=>c.cuota?Math.round(c.cuota/28000*2)*500000:0;
function nextCobro(f,n){let d=f;while(n>0){d=addD(d,1);if(dt(d).getDay()!==0)n--}return d}
function estado(c){
  const t=today(),pg=S.pagos.filter(p=>p.c===c.id&&p.f>=(c.desde||'')).map(p=>p.f).sort();
  const ini=c.desde||pg[0]||t,s=Math.max(saldo(c),0),q=c.cuota?Math.ceil(s/c.cuota):0;
  const base=(dt(t).getDay()===0||pagosDe(c,t).length)?t:addD(t,-1);
  const dias=Math.max(0,Math.round((dt(t)-dt(ini))/864e5))+1,sobra=CAP(c)-s;
  return {ini,dias,pagadas:new Set(pg).size,s,q,venc:q?nextCobro(base,q):t,sobra,cap:CAP(c)};
}
function msgEstado(c){
  const e=estado(c);
  return `Hola ${c.nombre} 👋\nTe comparto el estado de tu crédito al ${fmt(today())}:\n\n`+
  `📅 Inicio de pagos: ${fmt(e.ini)}\n⏳ Días pagando: ${e.dias} (${e.pagadas} cuotas pagadas)\n💵 Cuota diaria: ${Gs(c.cuota)}\n`+
  (e.s>0?`📌 Saldo pendiente: ${Gs(e.s)}\n🔢 Cuotas restantes: ${e.q}\n🗓️ Vencimiento estimado: ${fmt(e.venc)}\n\n`+
  (e.cap?(e.sobra>=0?`🔄 Si renovás hoy, te quedarían: ${Gs(e.sobra)}`:`🔄 Si renovás hoy, faltarían ${Gs(-e.sobra)} para completar el monto`):''):`✅ ¡Tu crédito está saldado!`)+`\n\nGracias por tu puntualidad 🙌`;
}
function waNum(t){let n=(t||'').replace(/\D/g,'');if(!n)return '';if(n.startsWith('0'))n='595'+n.slice(1);return n}
function waOpen(txt,tel){window.open('https://wa.me/'+waNum(tel)+'?text='+encodeURIComponent(txt),'_blank')}
function waCorr(id){
  const c=cget(id),m=modal(`<h3>📲 Detalle para ${c.nombre}</h3><label>WhatsApp del cliente (opcional)<input id="wt" inputmode="tel" placeholder="0981 123 456" value="${c.tel||''}"></label>
  <label>Mensaje (podés editarlo)<textarea id="wm" rows="12" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit">${msgEstado(c).replace(/</g,'&lt;')}</textarea></label>
  <div class="g2"><button class="btn" id="wc">Copiar</button><button class="big" id="ws" style="padding:11px">Enviar</button></div><button class="btn mt" id="wx" style="width:100%">Cerrar</button>`);
  const val=()=>m.querySelector('#wm').value,tel=()=>m.querySelector('#wt').value;
  m.querySelector('#ws').onclick=()=>{if(tel()!==(c.tel||'')){c.tel=tel();save()}waOpen(val(),tel())};
  m.querySelector('#wc').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(val()).then(()=>toast('Mensaje copiado'),()=>toast('No se pudo copiar'))};
  m.querySelector('#wx').onclick=()=>m.remove();
}
function resumenDia(){
  const f=fecha,tot=totalDia(f);
  const ok=S.corr.filter(c=>pagosDe(c,f).length),no=S.corr.filter(c=>npDe(c,f));
  waOpen(`📊 Resumen de cobros — ${DIAS[dt(f).getDay()]} ${fmt(f)}\n\n💰 Cobrado: ${Gs(tot)}\n✅ Cobraron: ${ok.length}\n`+(no.length?`❌ No pagaron (${no.length}): ${no.map(c=>c.nombre.replace('Corredor ','')).join(', ')}`:'❌ No pagaron: ninguno'),'');
}

const TABS=[['hoy','📅','Hoy'],['corr','👥','Corredores'],['caja','💰','Caja'],['hist','🕘','Historial'],['aj','⚙️','Ajustes']];
function render(){
  $('#sub').textContent=DIAS[new Date().getDay()]+' '+fmt(today());
  $('#app').innerHTML={hoy:vHoy,corr:vCorr,caja:vCaja,hist:vHist,aj:vAj}[view]();
  $('#tabs').innerHTML=TABS.map(t=>`<button class="${t[0]===view?'on':''}" onclick="view='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('');
}
load();render();setTimeout(askBackup,700);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
